[theme]
base = "light"
primaryColor = "#5B8DEF"
greenColor = "#22C55E"
redColor = "#EF4444"
font = "Inter"

[[theme.fontFaces]]
family = "Inter"
url = "https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/files/inter-latin-400-normal.woff2"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "Inter"
url = "https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/files/inter-latin-600-normal.woff2"
weight = "600"
style = "normal"

[[theme.fontFaces]]
family = "Inter"
url = "https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/files/inter-latin-700-normal.woff2"
weight = "700"
style = "normal"

[theme.light]
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#FFFFFF"
